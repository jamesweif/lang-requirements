  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563EB;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-light: #64748B;
      --au: #3B82F6; --nz: #10B981; --uk: #8B5CF6; --my: #EF4444; --ca: #F59E0B;
      --pte: #B91C1C; --ielts: #DC2626;
      --green: #059669;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    header { background: var(--primary); color: white; padding: 18px 24px; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.9; margin-top: 3px; }

    /* ===== 切换 Tabs ===== */
    .mode-tabs {
      display: flex;
      background: var(--card);
      border-bottom: 2px solid var(--border);
    }
    .mode-tab {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: var(--text-light);
      transition: all 0.2s;
    }
    .mode-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .mode-tab span { display: block; font-size: 0.75rem; font-weight: 400; margin-top: 2px; color: var(--text-light); }
    .mode-tab.active span { color: var(--primary); opacity: 0.7; }

    /* ===== 通用 Filter ===== */
    .filter-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; position: sticky; top: 0; z-index: 100; }
    .search-box { position: relative; margin-bottom: 10px; }
    .search-box input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .search-box input:focus { border-color: var(--primary); }
    .search-box .si { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
    .country-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .country-tab { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 2px solid transparent; background: var(--bg); color: var(--text-light); transition: all 0.2s; }
    .country-tab:hover { border-color: var(--border); }
    .country-tab.active { color: white; }
    .country-tab[data-country="au"].active { background: var(--au); }
    .country-tab[data-country="nz"].active { background: var(--nz); }
    .country-tab[data-country="uk"].active { background: var(--uk); }
    .country-tab[data-country="my"].active { background: var(--my); }
    .country-tab[data-country="ca"].active { background: var(--ca); }
    .country-tab[data-country="all"].active { background: var(--text); }

    .stats-bar { padding: 10px 24px; font-size: 0.85rem; color: var(--text-light); display: flex; justify-content: space-between; }

    /* ===== 签证视图 ===== */
    #visa-view { display: none; }
    #visa-view.active { display: block; }
    .visa-country-list { padding: 16px 24px 40px; }

    .visa-country-block { margin-bottom: 28px; }
    .visa-country-title { font-size: 1rem; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

    .visa-card {
      background: var(--card);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
      overflow: hidden;
    }
    .visa-card-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
    .visa-card-header:hover { background: #F8FAFC; }
    .visa-card-title { font-weight: 600; font-size: 0.95rem; }
    .visa-card-note { font-size: 0.75rem; color: var(--text-light); }
    .visa-card-body { display: none; border-top: 1px solid var(--border); padding: 14px 16px; background: #FAFBFF; }
    .visa-card.expanded .visa-card-body { display: block; }
    .visa-card.expanded .visa-card-header .arrow { transform: rotate(180deg); }
    .arrow { transition: transform 0.2s; font-size: 0.75rem; color: var(--text-light); }

    .visa-req-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .visa-req-item { background: white; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); }
    .exam-icon { width: 36px; height: 36px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: white; flex-shrink: 0; }
    .icon-pte { background: var(--pte); }
    .icon-pte-core { background: #F59E0B; }
    .icon-ielts { background: var(--ielts); }
    .visa-req-info .exam-name { font-size: 0.75rem; color: var(--text-light); }
    .visa-req-info .exam-score { font-weight: 700; font-size: 1rem; }
    .visa-req-info .exam-sub { font-size: 0.72rem; color: var(--text-light); margin-top: 1px; }

    /* ===== 学校视图 ===== */
    #school-view { display: none; }
    #school-view.active { display: block; }
    .results { padding: 0 24px 40px; }

    .school-card { background: var(--card); border-radius: 12px; margin-bottom: 12px; overflow: hidden; border: 1px solid var(--border); animation: fadeIn 0.25s ease; }
    .school-header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
    .school-header:hover { background: #F8FAFC; }
    .school-name { font-size: 1rem; font-weight: 600; }
    .school-city { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }
    .school-badge { font-size: 0.72rem; padding: 3px 9px; border-radius: 10px; font-weight: 500; }
    .badge-au { background: #DBEAFE; color: #1D4ED8; }
    .badge-nz { background: #D1FAE5; color: #065F46; }
    .badge-uk { background: #EDE9FE; color: #5B21B6; }
    .badge-my { background: #FEE2E2; color: #991B1B; }
    .badge-ca { background: #FEF3C7; color: #92400E; }

    .school-body { border-top: 1px solid var(--border); }
    .school-visa-bar { padding: 8px 18px; background: #EFF6FF; font-size: 0.78rem; color: var(--text-light); display: flex; align-items: center; gap: 6px; }
    .school-visa-bar .vl-flag { }
    .school-visa-bar .vl-score { font-weight: 600; color: var(--text); margin-left: auto; }

    .req-table { display: grid; grid-template-columns: 1fr 1fr; }
    .req-col { padding: 10px 16px; }
    .req-col:first-child { border-right: 1px solid var(--border); }
    .req-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.05em; margin-bottom: 7px; }
    .req-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; font-size: 0.85rem; }
    .req-row:last-child { margin-bottom: 0; }
    .icon-pte-sm { background: var(--pte); color: white; font-size: 0.62rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; flex-shrink: 0; }
    .icon-pte-core-sm { background: #F59E0B; color: white; font-size: 0.62rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; flex-shrink: 0; }
    .icon-ielts-sm { background: var(--ielts); color: white; font-size: 0.62rem; font-weight: 700; padding: 3px 5px; border-radius: 4px; flex-shrink: 0; }
    .vs-tag { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; margin-left: 5px; font-weight: 600; }
    .vs-higher { background: #FEE2E2; color: #991B1B; }
    .vs-meet { background: #D1FAE5; color: #065F46; }
    .school-note { background: #FEF3C7; padding: 8px 18px; font-size: 0.78rem; color: #92400E; }

    .expand-hint { font-size: 0.72rem; color: var(--text-light); }
    .empty { text-align: center; padding: 60px 24px; color: var(--text-light); }
    .empty-icon { font-size: 3rem; margin-bottom: 14px; }
    footer { text-align: center; padding: 18px; font-size: 0.78rem; color: var(--text-light); border-top: 1px solid var(--border); }

    @media (max-width: 640px) {
      header h1 { font-size: 1.2rem; }
      .filter-bar { padding: 10px 16px; }
      .visa-country-list { padding: 12px 16px 40px; }
      .visa-req-grid { grid-template-columns: 1fr; }
      .results { padding: 0 16px 40px; }
      .req-table { grid-template-columns: 1fr; }
      .req-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

  { id:'my-7',  name:'思特雅大学',          nameEn:'UCSI',       city:'吉隆坡',    country:'my', bachelor:{pte:'47–58',ielts:'5.5–6.0'},      master:{pte:'47–65',ielts:'5.5–6.5'},         note:'' },
  { id:'my-8',  name:'国油大学',            nameEn:'UTP',        city:'邦戈',      country:'my', bachelor:{pte:'47–59',ielts:'5.5–6.0'},      master:{pte:'47–63',ielts:'5.5–6.5'},         note:'工程类较强' },

  { id:'ca-2',  name:'麦吉尔大学',          nameEn:'McGill',     city:'蒙特利尔',  country:'ca', bachelor:{pte:'60–67',ielts:'6.5–7.0'},      master:{pte:'60–70',ielts:'6.5–7.0'},         note:'管理学院要求更高' },
  { id:'ca-3',  name:'不列颠哥伦比亚大学',    nameEn:'UBC',        city:'温哥华',    country:'ca', bachelor:{pte:'60–65',ielts:'6.5'},           master:{pte:'60–70',ielts:'6.5–7.0'},         note:'商科需 70' },
  { id:'ca-4',  name:'阿尔伯塔大学',        nameEn:'UAlberta',   city:'埃德蒙顿',  country:'ca', bachelor:{pte:'60',ielts:'6.5'},              master:{pte:'60–65',ielts:'6.5'},           note:'' },
  { id:'ca-5',  name:'滑铁卢大学',          nameEn:'Waterloo',   city:'滑铁卢',    country:'ca', bachelor:{pte:'60',ielts:'6.5'},              master:{pte:'60–65',ielts:'6.5'},           note:'计算机/工程著称' },
  { id:'ca-6',  name:'西蒙菲莎大学',        nameEn:'SFU',        city:'本拿比',    country:'ca', bachelor:{pte:'60',ielts:'6.5'},              master:{pte:'60–65',ielts:'6.5'},           note:'带 CO-OP 可加分' },
  { id:'ca-7',  name:'麦克马斯特大学',       nameEn:'McMaster',   city:'汉密尔顿',  country:'ca', bachelor:{pte:'60',ielts:'6.5'},              master:{pte:'60–65',ielts:'6.5'},           note:'医学院要求高' },
  { id:'ca-8',  name:'女王大学',            nameEn:"Queen's",    city:'金斯顿',    country:'ca', bachelor:{pte:'60',ielts:'6.5'},              master:{pte:'60–65',ielts:'6.5'},           note:'商科较知名' },
];

// ===== 状态 =====
let currentCountry = 'all';
let currentVisaCountry = null;
let currentMode = 'visa';  // 'visa' | 'school'
let searchText = '';

// ===== 工具 =====
function parseScore(s) {
  const m = String(s).match(/\d+/);
  return m ? parseInt(m[0]) : 0;
}

// ===== 视图切换 =====
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('visa-view').classList.toggle('active', mode === 'visa');
  document.getElementById('school-view').classList.toggle('active', mode === 'school');

  if (mode === 'visa') {
    renderVisaView();
  } else {
    renderSchoolView();
  }
}

// ===== 签证视图 =====
// 选中国家后显示该国全部签证类型
let selectedVisaCountry = null; // 'au' | 'nz' | 'uk' | 'my' | null

function renderVisaView() {
  const list = document.getElementById('visaCountryList');
  const countries = currentCountry === 'all' ? ['au','nz','uk','my','ca'] : [currentCountry];

  let html = '';
  countries.forEach(c => {
    const vd = visaData[c];
    html += `<div class="visa-country-block">
      <div class="visa-country-title" style="color:${vd.color}">
        ${vd.flag} ${vd.label}
        <span style="font-size:0.8rem;font-weight:400;color:var(--text-light)">— ${vd.types.length} 种签证</span>
      </div>`;
    vd.types.forEach(t => {
      const isCore = c === 'ca';
      const pteLabel = isCore ? '考点类' : '学术类';
      const pteBadgeBg = isCore ? '#FEF3C7' : '#FEE2E2';
      const pteBadgeFg = isCore ? '#92400E' : '#991B1B';
      const pteIconClass = isCore ? 'icon-pte-core' : 'icon-pte';
      html += `
      <div class="visa-card" id="vc-${c}-${t.id}">
        <div class="visa-card-header" onclick="this.parentElement.classList.toggle('expanded')">
          <div>
            <div class="visa-card-title">${t.name}</div>
            ${t.note ? `<div class="visa-card-note">${t.note}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:0.75rem;background:${pteBadgeBg};color:${pteBadgeFg};padding:2px 7px;border-radius:5px;font-weight:600;">PTE ${isCore?'Core':'A'} ${parseScore(t.pte.score)}</span>
            <span style="font-size:0.75rem;background:#DBEAFE;color:#1D4ED8;padding:2px 7px;border-radius:5px;font-weight:600;">IELTS ${parseScore(t.ielts.score)}</span>
            <span class="arrow">▾</span>
          </div>
        </div>
        <div class="visa-card-body">
          <div class="visa-req-grid">
            <div class="visa-req-item">
              <div class="exam-icon ${pteIconClass}">PTE</div>
              <div class="visa-req-info">
                <div class="exam-name">PTE ${pteLabel}</div>
                <div class="exam-score">${t.pte.score}</div>
                <div class="exam-sub">${t.pte.sub}</div>
              </div>
            </div>
            <div class="visa-req-item">
              <div class="exam-icon icon-ielts">IELTS</div>
              <div class="visa-req-info">
                <div class="exam-name">雅思 G 类（UKVI/General）</div>
                <div class="exam-score">${t.ielts.score}</div>
                <div class="exam-sub">${t.ielts.sub}</div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  list.innerHTML = html;

  const totalTypes = countries.reduce((n, c) => n + visaData[c].types.length, 0);
  document.getElementById('statsText').textContent =
    currentCountry === 'all'
      ? `共 ${Object.keys(visaData).length} 个国家 · ${totalTypes} 种签证类型`
      : `${visaData[currentCountry].flag} ${visaData[currentCountry].label} · ${totalTypes} 种签证类型`;
}

// ===== 学校视图 =====
// 选择某国家后，该国学校卡片顶部显示该国"默认"签证线（如 500 学生签）
let schoolVisaCountry = null; // 展示某国的默认签证基线

function renderSchoolView() {
  const results = document.getElementById('schoolResults');
  const filtered = schools.filter(s => {
    const matchCountry = currentCountry === 'all' || s.country === currentCountry;
    const q = searchText.toLowerCase();
    const matchSearch = !q || s.name.includes(q) || s.nameEn.toLowerCase().includes(q) || s.city.includes(q);
    return matchCountry && matchSearch;
  });

  const visaCountryKey = currentCountry === 'all' ? 'au' : currentCountry;
  const vd = visaData[visaCountryKey];
  // 默认取第一个签证类型的 PTE 基线
  const defaultVisa = vd ? vd.types[0] : null;

  document.getElementById('statsText').textContent = `共 ${filtered.length} 所学校`;

  if (filtered.length === 0) {
    results.innerHTML = `<div class="empty"><div class="empty-icon">🏫</div><h3>没有找到</h3><p>试试其他关键词或国家</p></div>`;
    return;
  }

  const BADGE = { au:'badge-au', nz:'badge-nz', uk:'badge-uk', my:'badge-my', ca:'badge-ca' };
  const CLABEL = { au:'澳洲', nz:'新西兰', uk:'英国', my:'马来西亚', ca:'加拿大' };

  results.innerHTML = filtered.map(s => {
    function reqRow(exam, score) {
      let badge = '';
      if (exam === 'pte' && defaultVisa) {
        const sc = parseScore(score);
        const vc = parseScore(defaultVisa.pte.score);
        if (sc > vc) badge = '<span class="vs-tag vs-higher">＞签证线</span>';
        else if (sc === vc) badge = '<span class="vs-tag vs-meet">=签证线</span>';
      }
      const cls = exam === 'pte' ? 'icon-pte-sm' : 'icon-ielts-sm';
      const label = exam === 'pte' ? 'PTE' : 'IELTS';
      return `<div class="req-row">
        <span class="${cls}">${label}</span>
        <span style="font-weight:600">${score}</span>${badge}
      </div>`;
    }

    return `<div class="school-card">
      <div class="school-header" onclick="this.parentElement.classList.toggle('expanded')">
        <div>
          <div class="school-name">${s.name}</div>
          <div class="school-city">${s.city} · ${s.nameEn}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="school-badge ${BADGE[s.country]}">${CLABEL[s.country]}</span>
          <span class="expand-hint">展开 ▾</span>
        </div>
      </div>
      <div class="school-body">
        <div class="req-table">
          <div class="req-col">
            <div class="req-title">🎓 本科 Bachelor</div>
            ${reqRow('pte', s.bachelor.pte)}
            ${reqRow('ielts', s.bachelor.ielts)}
          </div>
          <div class="req-col">
            <div class="req-title">🎓 硕士 Master</div>
            ${reqRow('pte', s.master.pte)}
            ${reqRow('ielts', s.master.ielts)}
          </div>
        </div>
        ${s.note ? `<div class="school-note">⚠️ ${s.note}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ===== 事件 =====
document.querySelectorAll('.country-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.country-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCountry = tab.dataset.country;
    if (currentMode === 'visa') renderVisaView();
    else renderSchoolView();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchText = e.target.value.trim();
  if (currentMode === 'school') renderSchoolView();
});

// ===== 初始化 =====
renderVisaView();
</script>
</body>
</html>
